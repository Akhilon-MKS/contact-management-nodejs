<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin-bottom: 5px;
        }

        header p {
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .update-btn {
            background: #16a34a;
            color: white;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            margin-left: 8px;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            margin: 0 5px 0 0;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            margin: 0;
        }

        .search {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f3f4f6;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Contact Management System</h1>
    <p>Manage your contacts using Node.js, Express, MongoDB and Mongoose</p>
</header>

<div class="container">

    <div class="card">

        <h2 id="formTitle">Add New Contact</h2>

        <form id="contactForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="contactId"
                    placeholder="Contact ID"
                    required
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Name"
                    required
                >

                <input
                    type="text"
                    id="phone"
                    placeholder="10-digit Phone Number"
                    maxlength="10"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

            </div>

            <button
                type="submit"
                class="add-btn"
                id="submitBtn">
                Add Contact
            </button>

            <button
                type="button"
                class="cancel-btn"
                id="cancelBtn"
                onclick="cancelEdit()"
                style="display:none;">
                Cancel
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>


    <div class="card">

        <h2>Contacts</h2>

        <input
            type="text"
            id="search"
            class="search"
            placeholder="Search by ID, name, phone or email..."
            onkeyup="searchContacts()"
        >

        <table>

            <thead>

                <tr>
                    <th>Contact ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="contactTableBody"></tbody>

        </table>

    </div>

</div>


<script>

    const API_URL = "./contacts";

    let contacts = [];

    let editingId = null;


    async function loadContacts() {

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Failed to fetch contacts");
            }

            contacts = await response.json();

            displayContacts(contacts);

        } catch (error) {

            console.error(error);

            showMessage(
                "Failed to load contacts",
                "error"
            );

        }

    }


    function displayContacts(data) {

        const tableBody =
            document.getElementById("contactTableBody");

        tableBody.innerHTML = "";


        if (data.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align:center;">
                        No contacts found
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(contact => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${contact.contactId}</td>

                <td>${contact.name}</td>

                <td>${contact.phone}</td>

                <td>${contact.email}</td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editContact('${contact.contactId}')">
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteContact('${contact.contactId}')">
                        Delete
                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        });

    }


    document
        .getElementById("contactForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const contact = {

                    contactId:
                        document
                            .getElementById("contactId")
                            .value
                            .trim(),

                    name:
                        document
                            .getElementById("name")
                            .value
                            .trim(),

                    phone:
                        document
                            .getElementById("phone")
                            .value
                            .trim(),

                    email:
                        document
                            .getElementById("email")
                            .value
                            .trim()

                };


                if (!/^[0-9]{10}$/.test(contact.phone)) {

                    showMessage(
                        "Phone number must contain exactly 10 digits",
                        "error"
                    );

                    return;

                }


                try {

                    let response;


                    if (editingId) {

                        response = await fetch(
                            `${API_URL}/${editingId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    name: contact.name,

                                    phone: contact.phone,

                                    email: contact.email

                                })

                            }
                        );

                    }

                    else {

                        response = await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(contact)

                            }
                        );

                    }


                    const result =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            result.error ||
                            result.message ||
                            "Operation failed",
                            "error"
                        );

                        return;

                    }


                    showMessage(

                        editingId
                            ? "Contact updated successfully"
                            : "Contact added successfully",

                        "success"

                    );


                    resetForm();

                    await loadContacts();

                }


                catch (error) {

                    console.error(error);

                    showMessage(
                        "Unable to connect to the server",
                        "error"
                    );

                }

            }
        );


    function editContact(id) {

        const contact =
            contacts.find(
                item =>
                    item.contactId === id
            );


        if (!contact) {
            return;
        }


        editingId = id;


        document.getElementById(
            "contactId"
        ).value = contact.contactId;


        document.getElementById(
            "name"
        ).value = contact.name;


        document.getElementById(
            "phone"
        ).value = contact.phone;


        document.getElementById(
            "email"
        ).value = contact.email;


        document.getElementById(
            "contactId"
        ).disabled = true;


        document.getElementById(
            "formTitle"
        ).textContent =
            "Update Contact";


        document.getElementById(
            "submitBtn"
        ).textContent =
            "Update Contact";


        document.getElementById(
            "submitBtn"
        ).className =
            "update-btn";


        document.getElementById(
            "cancelBtn"
        ).style.display =
            "inline-block";

    }


    async function deleteContact(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this contact?"
            );


        if (!confirmDelete) {
            return;
        }


        try {

            const response =
                await fetch(
                    `${API_URL}/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                showMessage(
                    result.message ||
                    "Failed to delete contact",
                    "error"
                );

                return;

            }


            showMessage(
                "Contact deleted successfully",
                "success"
            );


            await loadContacts();

        }


        catch (error) {

            console.error(error);

            showMessage(
                "Failed to delete contact",
                "error"
            );

        }

    }


    function searchContacts() {

        const search =
            document
                .getElementById("search")
                .value
                .toLowerCase()
                .trim();


        const filtered =
            contacts.filter(contact =>

                contact.contactId
                    .toLowerCase()
                    .includes(search)

                ||

                contact.name
                    .toLowerCase()
                    .includes(search)

                ||

                contact.phone
                    .includes(search)

                ||

                contact.email
                    .toLowerCase()
                    .includes(search)

            );


        displayContacts(filtered);

    }


    function cancelEdit() {

        resetForm();

    }


    function resetForm() {

        editingId = null;


        document
            .getElementById("contactForm")
            .reset();


        document
            .getElementById("contactId")
            .disabled = false;


        document
            .getElementById("formTitle")
            .textContent =
            "Add New Contact";


        document
            .getElementById("submitBtn")
            .textContent =
            "Add Contact";


        document
            .getElementById("submitBtn")
            .className =
            "add-btn";


        document
            .getElementById("cancelBtn")
            .style.display =
            "none";

    }


    function showMessage(message, type) {

        const messageBox =
            document.getElementById("message");


        messageBox.textContent =
            message;


        messageBox.className =
            `message ${type}`;


        messageBox.style.display =
            "block";


        setTimeout(() => {

            messageBox.style.display =
                "none";

        }, 3000);

    }


    loadContacts();

</script>

</body>
</html>
